<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pluri'Quali — Contrôle qualité terrain</title>
  <meta name="description" content="Contrôle qualité terrain — Agence Pluri'Elles">
  <meta name="theme-color" content="#6247AA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PluriQuali">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ====== LOGIN SCREEN ====== -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <h1>Pluri'Quali</h1>
    <p class="subtitle">Contrôle qualité terrain — Responsables Clients Pluri'Elles</p>
    <div class="form-group">
      <label for="login-name">Nom</label>
      <input type="text" id="login-name" placeholder="Ex : Boucif Benrabah">
    </div>
    <div class="form-group">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="prenom.nom@agence-plurielles.fr">
    </div>
    <div id="login-error" class="login-error"></div>
    <button class="btn btn-violet" onclick="doLogin()" style="margin-top:16px">Accéder aux contrôles</button>
  </div>
</div>

<!-- ====== APP SCREEN ====== -->
<div id="app-screen" class="hidden">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo"><span class="dot"></span> Pluri'Quali</div>
    <div class="navbar-actions">
      <button class="nav-icon-btn" onclick="showHistory()" title="Historique">📋</button>
      <a href="https://agence-plurielles.tech">← Portail</a>
    </div>
  </nav>

  <!-- Progress bar -->
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

  <div class="main-content">

    <!-- Identification -->
    <div class="section-card open">
      <div class="section-header" onclick="toggleSection(this)">
        <span class="section-tag" style="background:#6247AA">ID</span>
        <span class="section-title">Identification du site</span>
        <span class="section-chevron">▾</span>
      </div>
      <div class="section-body">
        <div class="form-group">
          <label>Client / Site</label>
          <input type="text" id="field-client" placeholder="Ex : Gecina — Tour Pacific">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="field-date">
        </div>
        <div class="form-group">
          <label>Type de contrôle</label>
          <select id="field-type"><option value="">— Sélectionner —</option></select>
        </div>
        <div class="form-group">
          <label>Métier</label>
          <select id="field-metier"><option value="">— Sélectionner —</option></select>
        </div>
        <div class="form-group">
          <label>Ressource</label>
          <input type="text" id="field-ressource" placeholder="Nom du salarié(e)">
        </div>
      </div>
    </div>

    <!-- Criteria sections (injected by JS) -->
    <div id="sections-container"></div>

    <!-- Photos -->
    <div class="photo-section">
      <h3>📷 Photos</h3>
      <input type="file" accept="image/*" capture="environment" multiple id="photo-input" style="display:none" onchange="handlePhotos(this)">
      <button class="photo-upload-btn" onclick="document.getElementById('photo-input').click()">Prendre ou ajouter des photos</button>
      <div class="photo-grid" id="photo-grid"></div>
    </div>

    <!-- Plan d'actions -->
    <div class="actions-section">
      <h3>📋 Plan d'actions</h3>
      <div class="comment-area">
        <textarea id="action-plan" placeholder="Recommandations et plan d'actions..."></textarea>
        <button class="mic-btn" onclick="startDictation('action-plan', this)" title="Dictée vocale">🎤</button>
      </div>
    </div>

    <!-- Validation -->
    <div class="validation-section">
      <div class="chips" id="chips"></div>
      <button class="btn btn-violet" onclick="validateAndGenerate()">Valider et générer le rapport</button>
    </div>

  </div>
</div>

<!-- ====== HISTORY SCREEN ====== -->
<div id="history-screen" class="hidden">
  <nav class="navbar">
    <div class="logo"><span class="dot"></span> Pluri'Quali</div>
    <div class="navbar-actions">
      <button class="nav-icon-btn" onclick="showApp()" title="Retour">← Retour</button>
    </div>
  </nav>
  <div class="main-content">
    <h2 style="font-family:'Playfair Display',serif;margin:16px 0">Historique des contrôles</h2>
    <div class="history-actions">
      <button class="btn btn-outline" onclick="exportCSV()">Exporter CSV</button>
      <button class="btn btn-violet" onclick="showApp()">Nouveau contrôle</button>
    </div>
    <div id="history-list"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
