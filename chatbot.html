<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="theme-color" content="#6247AA"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Pluri'IA"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>Pluri'IA — Assistant Intelligent</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--violet:#6247AA;--violet-light:#7C5CC4;--foggy:#CEC2F0;--black:#0D0B11;--surface:#13101C;--surface2:#1C1828;--border:rgba(255,255,255,0.08);--text:rgba(255,255,255,0.88);--muted:rgba(255,255,255,0.4);--safe-bottom:env(safe-area-inset-bottom,0px);}
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;overflow:hidden;}
    body{font-family:'DM Sans',sans-serif;background:var(--black);color:var(--text);display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;}

    /* ─── Header ─── */
    .header{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
    .robot-svg{width:40px;height:40px;flex-shrink:0;}
    .logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;flex:1;}
    .logo-text span{color:var(--foggy);font-weight:400;font-size:11px;display:block;margin-top:1px;}
    .status-dot{width:8px;height:8px;border-radius:50%;background:#3db97a;box-shadow:0 0 8px rgba(61,185,122,0.6);animation:pulse-dot 2s infinite;}
    .status-text{font-size:11px;color:var(--muted);margin-right:4px;}
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}
    .mode-badge{font-size:9px;padding:3px 7px;border-radius:10px;}
    .mode-api{background:rgba(61,185,122,0.15);color:#7aefb4;border:1px solid rgba(61,185,122,0.3);}
    .mode-local{background:rgba(232,168,56,0.15);color:#f0c060;border:1px solid rgba(232,168,56,0.3);}

    /* ─── Install banner ─── */
    .install-banner{display:none;padding:10px 16px;background:linear-gradient(135deg,var(--violet),var(--violet-light));color:white;font-size:13px;text-align:center;cursor:pointer;flex-shrink:0;gap:8px;align-items:center;justify-content:center;}
    .install-banner svg{width:18px;height:18px;fill:white;flex-shrink:0;}
    .install-banner.show{display:flex;}
    .install-dismiss{background:none;border:none;color:rgba(255,255,255,0.7);font-size:18px;cursor:pointer;padding:0 4px;margin-left:8px;}

    /* ─── Messages ─── */
    .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;}
    .messages::-webkit-scrollbar{width:3px;}
    .messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
    .msg{display:flex;gap:8px;animation:msgIn 0.3s ease;}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{flex-direction:row-reverse;}
    .msg-avatar{width:30px;height:30px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
    .msg.bot .msg-avatar{background:linear-gradient(135deg,var(--violet),var(--violet-light));color:white;font-family:'Syne',sans-serif;}
    .msg.user .msg-avatar{background:rgba(255,255,255,0.08);border:1px solid var(--border);color:var(--muted);}
    .msg-bubble{max-width:85%;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.65;-webkit-user-select:text;user-select:text;}
    .msg.bot .msg-bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px;}
    .msg.user .msg-bubble{background:var(--violet);color:white;border-bottom-right-radius:4px;}
    .msg-bubble strong{color:var(--foggy);}
    .msg.user .msg-bubble strong{color:rgba(255,255,255,0.9);}
    .msg-bubble ul{padding-left:16px;margin-top:6px;}
    .msg-bubble li{margin-bottom:4px;}
    .msg-bubble a{color:var(--foggy);font-weight:700;text-decoration:underline;}
    .typing-indicator{display:flex;gap:5px;align-items:center;padding:14px 16px;}
    .typing-dot{width:7px;height:7px;border-radius:50%;background:var(--violet-light);animation:typing 1.2s infinite;}
    .typing-dot:nth-child(2){animation-delay:0.2s;}
    .typing-dot:nth-child(3){animation-delay:0.4s;}
    @keyframes typing{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}

    /* ─── Suggestions ─── */
    .suggestions{padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;}
    .sug{padding:8px 14px;background:rgba(98,71,170,0.15);border:1px solid rgba(98,71,170,0.3);border-radius:20px;font-size:12px;color:var(--foggy);cursor:pointer;transition:all 0.2s;white-space:nowrap;}
    .sug:hover,.sug:active{background:rgba(98,71,170,0.3);border-color:var(--violet);}

    /* ─── Input ─── */
    .input-wrap{padding:12px 16px;padding-bottom:max(12px,var(--safe-bottom));background:var(--surface);border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;}
    .input-field{flex:1;padding:11px 14px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;resize:none;transition:border-color 0.2s;max-height:120px;min-height:44px;-webkit-appearance:none;}
    .input-field::placeholder{color:var(--muted);}
    .input-field:focus{border-color:var(--violet-light);}
    .send-btn{width:44px;height:44px;background:linear-gradient(135deg,var(--violet),var(--violet-light));border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
    .send-btn:active{transform:scale(0.95);}
    .send-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
    .send-btn svg{width:18px;height:18px;fill:white;}
    .mic-btn{width:44px;height:44px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;position:relative;-webkit-tap-highlight-color:transparent;}
    .mic-btn:active{background:rgba(255,255,255,0.1);}
    .mic-btn svg{width:20px;height:20px;fill:var(--muted);transition:fill 0.2s;}
    .mic-btn.recording{background:rgba(220,38,38,0.15);border-color:rgba(220,38,38,0.5);animation:mic-pulse 1.5s infinite;}
    .mic-btn.recording svg{fill:#ef4444;}
    @keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0.3)}50%{box-shadow:0 0 0 8px rgba(220,38,38,0)}}
    .mic-btn.unsupported{opacity:0.3;cursor:not-allowed;}
    .voice-status{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--foggy);background:var(--surface2);padding:2px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.2s;}
    .mic-btn.recording .voice-status{opacity:1;}
  </style>
</head>
<body>

<!-- Install Banner -->
<div class="install-banner" id="install-banner">
  <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
  <span>Installer Pluri'IA sur votre mobile</span>
  <button class="install-dismiss" id="install-dismiss">&times;</button>
</div>

<!-- Header -->
<div class="header">
  <svg class="robot-svg" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="14" width="28" height="22" rx="6" fill="#6247AA"/>
    <rect x="14" y="18" width="8" height="6" rx="3" fill="#0D0B11"/>
    <rect x="26" y="18" width="8" height="6" rx="3" fill="#0D0B11"/>
    <circle id="eye-l" cx="18" cy="21" r="2" fill="#CEC2F0"/>
    <circle id="eye-r" cx="30" cy="21" r="2" fill="#CEC2F0"/>
    <rect x="18" y="28" width="12" height="3" rx="1.5" fill="#CEC2F0" opacity="0.6"/>
    <rect x="6" y="20" width="4" height="10" rx="2" fill="#7C5CC4"/>
    <rect x="38" y="20" width="4" height="10" rx="2" fill="#7C5CC4"/>
    <rect x="20" y="8" width="8" height="6" rx="2" fill="#7C5CC4"/>
    <circle cx="24" cy="8" r="2" fill="#CEC2F0"/>
  </svg>
  <div class="logo-text">Pluri'IA<span>Assistant Pluri'Elles</span></div>
  <div class="status-text" id="status-text">En ligne</div>
  <div class="status-dot" id="status-dot"></div>
  <span class="mode-badge mode-api" id="mode-badge">Claude API</span>
</div>

<!-- Messages -->
<div class="messages" id="messages"></div>

<!-- Suggestions -->
<div class="suggestions" id="suggestions">
  <div class="sug" onclick="sendSug(this)">Qui est Pluri'Elles ?</div>
  <div class="sug" onclick="sendSug(this)">Qu'est-ce qu'un ERP ?</div>
  <div class="sug" onclick="sendSug(this)">Le factotum</div>
  <div class="sug" onclick="sendSug(this)">Accueil VIP</div>
  <div class="sug" onclick="sendSug(this)">Politique RSE</div>
  <div class="sug" onclick="sendSug(this)">Nos formations</div>
</div>

<!-- Input -->
<div class="input-wrap">
  <textarea class="input-field" id="user-input" placeholder="Posez votre question..." rows="1"></textarea>
  <button class="mic-btn" id="mic-btn" onclick="toggleVoice()" title="Dictee vocale">
    <span class="voice-status" id="voice-status">Parlez...</span>
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
  </button>
  <button class="send-btn" id="send-btn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const N8N_WEBHOOK_URL = 'https://n8n.srv1501565.hstgr.cloud/webhook/pluriia';

// ============================================================
// PWA — Service Worker + Install
// ============================================================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(e) { console.warn('SW registration failed', e); });
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});

document.getElementById('install-banner').addEventListener('click', function() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function() { deferredPrompt = null; });
  document.getElementById('install-banner').classList.remove('show');
});

document.getElementById('install-dismiss').addEventListener('click', function(e) {
  e.stopPropagation();
  document.getElementById('install-banner').classList.remove('show');
});

// ============================================================
// LOCAL KB (fallback hors-ligne)
// ============================================================
const LOCAL_KB = {
  'agence|plurielles|présent|qui': "**L'Agence Pluri'Elles** est une agence de services generaux fondee en mars 2010, basee a Clichy (92110). Nous intervenons sur **60 sites en Ile-de-France** avec ~237 collaborateurs (93% CDI). CA ~5,4M\u20ac. Metiers : accueil, factotum, courrier, numerisation, hospitality.",
  'erp|établissement recevant|incendie|évacuation': "Un **ERP** est classe en 5 categories :\n- **1ere** >1500p | **2eme** 701-1500 | **3eme** 301-700 | **4eme** <300 | **5eme** sous seuils\n\nRegistre de securite obligatoire. Min 1 exercice d'evacuation/an. PMR : porte min **90cm**.",
  'factotum|polyvalent|agent sg': "Le **Factotum** gere : montage/demontage mobilier, gestion stocks, suivi fontaines a eau, coordination avec le RSG, manutention, petits travaux, preparation salles, reapprovisionnement fournitures. **Permis B obligatoire**.",
  'vip|protocole|luxe|hôtesse': "Accueil VIP : **7 secondes** pour la 1ere impression, **80%** communication non-verbale. Regle des **3P** : Propre, Professionnel, Parfait.",
  'règlement|discipline|sanction|faute': "Echelle des sanctions :\n1. **Avertissement** | 2. **Mise a pied** (max 10j) | 3. **Mutation** | 4. **Retrogradation** | 5. **Licenciement**",
  'rse|carbone|environnement|développement durable': "RSE Pluri'Elles :\n- Bilan carbone 2022 : **30,41 tCO2e**\n- Deplacements pro : **49,64%** des emissions\n- Engagements : zero papier, mobilite douce, bio/local, recyclage",
  'formation|cours|apprendre|portail': "**7 formations gratuites** sur agence-plurielles.tech :\nERP (45min), VIP (40min), Property Manager (35min), Factotum (50min), Courrier (30min), Numerisation (40min), Hospitality (40min)",
  'recrutement|postuler|candidature|emploi|embauche|cv|offre': "Pour postuler :\n- **Assia Bachir** (assia.bachir@agence-plurielles.fr)\n- **Oumou Soumah** (oumou.soumah@agence-plurielles.fr)\n- Tel : **01.41.34.01.02**",
  'rémunération|salaire|prime|paye|paie': "Politique remuneration :\n- **Mieux disant social** : 5 a 10% au-dessus des minima\n- Primes de satisfaction client et d'etat de service\n- Remuneration moyenne temps plein : **1 824\u20ac**",
  'responsable|directeur|direction|équipe': "Direction :\n- **Annie Roussey** : DG Fondatrice\n- **Solange Lecarpentier** : Presidente\n- **Alexandre Maury** : DG Developpement"
};

function localFallback(q) {
  var lower = q.toLowerCase();
  for (var keys in LOCAL_KB) {
    if (keys.split('|').some(function(k) { return lower.includes(k); })) return LOCAL_KB[keys];
  }
  return "Je n'ai pas trouve de reponse precise. Contactez l'agence : **01.41.34.01.02**";
}

// ============================================================
// CHAT ENGINE
// ============================================================
const history = [];
let isTyping = false;

function formatText(t) {
  return t
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*<\/li>)/, '<ul>$1</ul>')
    .replace(/\n/g, '<br/>');
}

function appendMsg(role, text) {
  var msgs = document.getElementById('messages');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="msg-avatar">' + (role === 'bot' ? 'P' : '\uD83D\uDC64') + '</div><div class="msg-bubble">' + formatText(text) + '</div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  var msgs = document.getElementById('messages');
  var div = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing-msg';
  div.innerHTML = '<div class="msg-avatar">P</div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() { var t = document.getElementById('typing-msg'); if (t) t.remove(); }

function setStatus(online) {
  var dot = document.getElementById('status-dot');
  var txt = document.getElementById('status-text');
  var badge = document.getElementById('mode-badge');
  if (online) {
    dot.style.background = '#3db97a'; dot.style.boxShadow = '0 0 8px rgba(61,185,122,0.6)';
    txt.textContent = 'En ligne';
    badge.className = 'mode-badge mode-api'; badge.textContent = 'Claude API';
  } else {
    dot.style.background = '#e8a838'; dot.style.boxShadow = '0 0 8px rgba(232,168,56,0.4)';
    txt.textContent = 'Mode local';
    badge.className = 'mode-badge mode-local'; badge.textContent = 'Base locale';
  }
}

async function callAPI(userMessage, isRetry) {
  if (!isRetry) history.push({ role: 'user', content: userMessage });
  var msgSlice = history.slice(-6);
  var payload = { system: 'USE_SERVER', messages: msgSlice };
  var controller = new AbortController();
  var timeout = setTimeout(function() { controller.abort(); }, 120000);
  try {
    var res = await fetch(N8N_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    clearTimeout(timeout);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    var reply = data.reply || data.text || data.message || JSON.stringify(data);
    history.push({ role: 'assistant', content: reply });
    return reply;
  } catch(err) {
    clearTimeout(timeout);
    throw err;
  }
}

async function sendMessage() {
  var input = document.getElementById('user-input');
  var text = input.value.trim();
  if (!text || isTyping) return;
  input.value = ''; input.style.height = 'auto';
  document.getElementById('suggestions').style.display = 'none';
  isTyping = true;
  document.getElementById('send-btn').disabled = true;
  appendMsg('user', text);
  showTyping();
  var reply;
  for (var attempt = 1; attempt <= 3; attempt++) {
    try {
      reply = await callAPI(text, attempt > 1);
      setStatus(true);
      break;
    } catch(e) {
      if (attempt < 3) {
        await new Promise(function(r) { setTimeout(r, attempt * 1000); });
      } else {
        reply = localFallback(text);
        setStatus(false);
      }
    }
  }
  removeTyping();
  appendMsg('bot', reply);
  isTyping = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

function sendSug(el) { document.getElementById('user-input').value = el.textContent; sendMessage(); }

// Auto-resize textarea
document.getElementById('user-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
document.getElementById('user-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ============================================================
// VOICE INPUT (Web Speech API)
// ============================================================
var recognition = null;
var isRecording = false;
var silenceTimer = null;

function initVoice() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micBtn = document.getElementById('mic-btn');
  if (!SR) { micBtn.classList.add('unsupported'); micBtn.onclick = null; return; }
  recognition = new SR();
  recognition.lang = 'fr-FR';
  recognition.continuous = false;
  recognition.interimResults = true;

  var finalSegments = [];
  var currentInterim = '';
  var hasReceivedSpeech = false;

  function resetSilence() { if (silenceTimer) clearTimeout(silenceTimer); silenceTimer = null; }
  function startSilence() {
    resetSilence();
    silenceTimer = setTimeout(function() {
      if (document.getElementById('user-input').value.trim() && isRecording) {
        isRecording = false;
        try { recognition.stop(); } catch(e) {}
      }
    }, 1000);
  }

  recognition.onresult = function(e) {
    hasReceivedSpeech = true;
    finalSegments = []; currentInterim = '';
    for (var i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalSegments.push(e.results[i][0].transcript);
      else currentInterim += e.results[i][0].transcript;
    }
    var input = document.getElementById('user-input');
    input.value = (recognition._saved || '') + finalSegments.join('') + currentInterim;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    if (currentInterim) { resetSilence(); document.getElementById('voice-status').textContent = 'Ecoute...'; }
    else { startSilence(); document.getElementById('voice-status').textContent = 'Envoi...'; }
  };

  recognition.onend = function() {
    if (isRecording) {
      var saved = document.getElementById('user-input').value.trim();
      if (saved && hasReceivedSpeech) startSilence();
      finalSegments = []; currentInterim = '';
      try { recognition.start(); } catch(err) {
        isRecording = false; resetSilence(); stopRec();
        if (saved) sendMessage();
      }
      if (saved) recognition._saved = saved + ' ';
    } else {
      resetSilence(); stopRec();
      if (document.getElementById('user-input').value.trim()) sendMessage();
      finalSegments = []; currentInterim = ''; hasReceivedSpeech = false;
      delete recognition._saved;
    }
  };

  recognition.onerror = function(e) {
    if (e.error === 'not-allowed') alert("Autorisez l'acces au microphone.");
    if (e.error !== 'no-speech') { isRecording = false; resetSilence(); stopRec(); }
  };
}

function toggleVoice() {
  if (!recognition) return;
  if (isRecording) {
    isRecording = false;
    if (silenceTimer) clearTimeout(silenceTimer);
    recognition.stop();
  } else {
    document.getElementById('user-input').value = '';
    delete recognition._saved;
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('voice-status').textContent = 'Parlez...';
    document.getElementById('user-input').placeholder = 'Parlez maintenant...';
    try { recognition.start(); } catch(e) {}
  }
}

function stopRec() {
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('user-input').placeholder = 'Posez votre question...';
}

initVoice();

// ============================================================
// Robot eye tracking (touch/mouse)
// ============================================================
function moveEyes(x, y) {
  var el = document.getElementById('eye-l'); if (!el) return;
  var svg = document.querySelector('.robot-svg'); if (!svg) return;
  var r = svg.getBoundingClientRect();
  var dx = Math.max(-1.5, Math.min(1.5, (x - r.left - r.width/2) / window.innerWidth * 3));
  var dy = Math.max(-1.5, Math.min(1.5, (y - r.top - r.height/2) / window.innerHeight * 3));
  el.setAttribute('cx', 18 + dx); el.setAttribute('cy', 21 + dy);
  document.getElementById('eye-r').setAttribute('cx', 30 + dx);
  document.getElementById('eye-r').setAttribute('cy', 21 + dy);
}
document.addEventListener('mousemove', function(e) { moveEyes(e.clientX, e.clientY); });
document.addEventListener('touchmove', function(e) { if (e.touches[0]) moveEyes(e.touches[0].clientX, e.touches[0].clientY); });
