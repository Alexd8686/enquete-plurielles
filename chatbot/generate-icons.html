<!DOCTYPE html>
<html><head><title>Generate Icons</title></head>
<body>
<p>Right-click each canvas and "Save image as" icon-192.png / icon-512.png</p>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function draw(id, s) {
  var c = document.getElementById(id).getContext('2d');
  // Background
  c.fillStyle = '#6247AA';
  c.beginPath();
  c.roundRect(0, 0, s, s, s * 0.2);
  c.fill();
  // Text
  c.fillStyle = '#FFFFFF';
  c.font = 'bold ' + (s * 0.3) + 'px sans-serif';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText('PQ', s/2, s/2 - s*0.05);
  c.font = (s * 0.1) + 'px sans-serif';
  c.fillStyle = '#CEC2F0';
  c.fillText('Chat', s/2, s/2 + s*0.2);
}
draw('c192', 192);
draw('c512', 512);
// Auto-download
['c192','c512'].forEach(function(id){
  var canvas = document.getElementById(id);
  var size = id === 'c192' ? 192 : 512;
  canvas.toBlob(function(blob){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'icon-' + size + '.png';
    a.click();
  });
});
</script>
</body>
</html>
